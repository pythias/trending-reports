<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Trending 日报</title>
    <meta name="description" content="每日 GitHub Trending TOP 10，统一模板渲染历史数据。">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,640;1,9..144,500&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="page">
        <header class="masthead">
            <div class="brand">
                <p class="kicker">GitHub Trending</p>
                <h1>日报</h1>
            </div>
            <nav class="date-nav" aria-label="历史日期">
                <button type="button" id="prev-date" class="date-btn" aria-label="上一期">←</button>
                <label class="date-picker">
                    <span class="sr-only">选择日期</span>
                    <select id="date-select"></select>
                </label>
                <button type="button" id="next-date" class="date-btn" aria-label="下一期">→</button>
            </nav>
        </header>

        <p class="lede" id="meta">正在载入当日榜单…</p>
        <section class="stats" id="stats" hidden></section>
        <ol class="ranking" id="ranking"></ol>
        <section class="fallen" id="fallen" hidden></section>

        <footer class="colophon">
            <p>每天只更新数据，页面由同一份模板渲染。数据来自 <a href="https://github.com/trending" target="_blank" rel="noopener">GitHub Trending</a>。</p>
        </footer>
    </div>
    <script src="app.js"></script>
</body>
</html>
